# Cloudflare Pages PREVIEW deploy for any non-main branch.
#
# Production deploys stay in deploy.yml (main only). This workflow exists so a
# design branch can be reviewed at a real Cloudflare URL before anything reaches
# main: it builds `dist` and pushes it as a *preview* deployment of the same
# Pages project, which Cloudflare publishes at
#   https://<deployment-id>.motopass.pages.dev
# and links from the project's Deployments tab. Nothing here touches the
# production branch or its aliases.
name: Preview deploy

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check Pages token is present
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_PAGES_TOKEN is not set, so no preview URL can be produced."
            exit 1
          fi
          echo "Scoped Pages token present (value never logged)."
      - name: Deploy preview to Cloudflare Pages
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          npx --yes wrangler@4 pages deploy ./dist \
            --project-name=motopass \
            --branch="${BRANCH}" \
            --commit-dirty=true | tee /tmp/preview.log
          URL=$(grep -Eo 'https://[a-z0-9]+\.motopass\.pages\.dev' /tmp/preview.log | tail -1)
          echo "### Preview: ${URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "PREVIEW_URL=${URL}"
