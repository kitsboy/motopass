name: CI

# The gate that protects `main`.
#
# History: this workflow was switched off by hand on 2026-07-15 and, until 2026-09-15,
# the ONLY check on a main push was "Deploy motopass to Cloudflare Pages" (build + live
# marker). lint, unit tests, data/trust validation, the bundle budget and the
# source-probe self-test therefore ran on NO push at all — the harness assertions
# (v5/v6/v7) were only ever run by hand. Re-enabled 2026-09-15 after fixing both
# chronic reds at the root:
#   1. `npm run lint` — 11 errors (eslint-plugin-react-hooks v7 compiler diagnostics +
#      no-explicit-any). Fixed in code; the one advisory rule that only matters once
#      React Compiler is enabled (`react-hooks/preserve-manual-memoization`) is a warn.
#   2. the pitch anchor — `git diff --exit-code` after `pitch:sync` could NEVER pass:
#      BUILD_ID is `<date>-<sha7>` of the commit being built, so a committed snapshot
#      cannot name it. Replaced by `npm run pitch:check`, which normalises provenance
#      but still fails the moment research/countries.json moves the published figures.
# Still NOT blocking, on purpose: prettier:check is warn-only (354 src files predate
# the check; a repo-wide reformat is deliberately deferred so it does not collide with
# in-flight cards). Deploy/live-health below are verifiers — the CF Pages git
# integration is the ONE deployer.

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run sync:build
      - run: npm run lint
      # warn-only: the repo predates this check (354 src files are not prettier-formatted).
      # `prettier --check` exits 1 on drift, and `continue-on-error` keeps the JOB green but
      # GitHub still attaches an ERROR-level annotation ("Process completed with exit code 1.")
      # to the run — so a fully green run read as "1 error" on the commit. The check now
      # swallows its own exit code and reports the drift as a warning annotation with a real
      # count. A one-shot `npx prettier --write src` cleanup flips it back to blocking.
      - name: Prettier (warn-only until the repo-wide reformat lands)
        run: |
          set +e
          OUT=$(npm run prettier:check 2>&1)
          RC=$?
          set -e
          N=$(printf '%s\n' "$OUT" | sed 's/\x1b\[[0-9;]*m//g' | grep -c '^\[warn\]' || true)
          if [ "$RC" -ne 0 ]; then
            echo "::warning::prettier drift in $N src files — warn-only, repo-wide reformat deliberately deferred"
            echo "prettier drift: $N file(s) would be reformatted (not blocking)"
          else
            echo "prettier: clean"
          fi
      - run: npm run validate:data
      - run: npm run validate:stamps
      # Every proof height must match the chain, and a proof that does not
      # resolve may carry no height at all. This is the gate that keeps a
      # hardcoded block number out of the corpus.
      # Every route in the sitemap must be known to the Pages middleware, or a
      # real page 404s for anyone arriving from a link.
      - run: npm run check:routes
      - run: npm run check:proofs
      - run: npm run trust:check
      - run: npm run tools:check
      # A quote that has drifted off its page is worse than no source at all: it
      # looks like evidence. This reads every claim URL in a real browser and
      # writes src/data/quoteStatus.json — the site calls a figure traced only
      # when its entry there is true.
      - run: npx playwright install --with-deps chromium
      - name: Every claim quote is still on its source page
        run: node scripts/check-quotes.mjs
      # One canonical check (scripts/sync-pitch-anchor.mjs --check): it pins spot +
      # timestamp to the committed anchor, ignores the volatile BUILD id, and fails when
      # the published figures no longer match research/countries.json.
      - name: Ensure pitch anchor in sync
        run: npm run pitch:check
      - run: npm test
      - run: npm run build
      - run: npm run check:build-salt
      - run: node scripts/check-bundle-size.mjs
      - name: Lighthouse a11y budget (warn-only)
        run: npm run a11y:check
        continue-on-error: true
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Source-probe self-test (empty content must never become an ok baseline)
        run: npm run intel:probe:selftest
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: footer-gap-screenshots
          path: artifacts/playwright/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Build only — Cloudflare Pages git integration is the ONE deployer (retired 2026-09-11, see HQ
  # docs/CLOUDFLARE-TOKEN-RETIREMENT.md). The manual wrangler fallback lives in deploy.yml as a
  # workflow_dispatch-only job and uses the scoped CLOUDFLARE_PAGES_TOKEN secret.
  deploy:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run sync:build
      - run: npm run build
      - name: Deploy summary
        if: always()
        run: |
          BUILD_ID=$(node -p "require('fs').readFileSync('src/lib/buildInfo.ts','utf8').match(/BUILD_ID = '([^']+)'/)[1]")
          {
            echo "## MotoPass deploy"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Site | https://motopass.giveabit.io |"
            echo "| BUILD | \`${BUILD_ID}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Artifact | \`dist/\` from build-test job (7-day retention) |"
            echo ""
            echo "Post-deploy: \`live-health\` job runs \`verify:live:ci\`."
          } >> "$GITHUB_STEP_SUMMARY"

  live-health:
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache-live
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:live:ci
      - name: Record live deploy in handoff
        run: node scripts/update-handoff-deploy.mjs
      # Main is protected, so the deploy record goes up as a pull request rather
      # than a direct push. Same branch every time: the PR updates in place.
      - name: Open PR for the deploy record
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/deploy-log
          delete-branch: true
          title: 'docs: record live deploy'
          commit-message: 'docs: record live deploy'
          add-paths: docs/KIMI-HANDOFF.md
          body: 'The deploy verifier wrote the live commit into the handoff. Merging is bookkeeping only.'
      - name: Deploy summary JSON
        if: always()
        run: node scripts/deploy-summary.mjs --out artifacts/deploy-summary.json
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deploy-summary
          path: artifacts/deploy-summary.json
          retention-days: 30
          if-no-files-found: ignore
