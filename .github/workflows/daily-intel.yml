name: Daily Country Intel (self-heal)

on:
  schedule:
    # 06:00 UTC daily — after btcmap sync (Mon) and before morning review
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  intel-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # 1) Seed any missing schema v3 blocks (idempotent — preserves edits)
      - run: npm run intel:migrate

      # 2) Freshness sweep + write runtime manifest (with Satohash API health)
      - run: npm run intel:freshness
      - run: npm run intel:write

      # 3) Auto-research — fetch Wikipedia + BTC Map + CoinGecko for stale countries,
      #    diff against corpus, apply verified changes with audit trail.
      - name: Auto-research (Wikipedia + BTC Map + CoinGecko)
        run: npm run intel:fetch
        env:
          NODE_OPTIONS: '--max-old-space-size=512'

      # 4) Official-source watchdog — detects rule-page changes (baselines first run)
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Source-probe self-test
        # An empty render / empty rule scope must never become an "ok" baseline.
        # Pure assertions always run. Chromium is installed above so the browser fixture can run.
        run: npm run intel:probe:selftest
      - name: Probe official sources
        run: npm run intel:probe
        env:
          PROBE_TIMEOUT_MS: '15000'
          PROBE_CONCURRENCY: '8'

      # 5) Re-anchor changed programs via Satohash API (self-heal to the chain)
      #    One run covers the 21-program catalog. A 429 still defers the rest.
      - name: Satohash re-stamp loop
        run: npm run intel:stamp
        env:
          SATOHASH_API_URL: ${{ vars.SATOHASH_API_URL }}
          SATOHASH_API_KEY: ${{ secrets.SATOHASH_API_KEY }}
          STAMP_DELAY_MS: '2500'
          MAX_STAMPS_PER_RUN: '21'

      # 6) Rewrite manifest with probe/stamp state + the trust pages that read it
      - run: npm run intel:write
      - run: npm run intel:check
      - run: npm run trust:envelopes
      - run: npm run trust:check
      - run: npm run validate:data
      - run: npm run validate:stamps

      - name: Refresh travel advice
        run: npm run advisories:fetch

      # 7) Auto-commit DETECTION + re-anchors + research changes (facts, never invented rules)
      # Main is protected: the sweep opens a PR and CI decides. A re-stamp that
      # moves a block height therefore meets check:proofs before it ships.
      - name: Open PR for the intel sweep
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/daily-intel
          delete-branch: true
          title: 'chore(intel): daily freshness sweep'
          commit-message: 'chore(intel): daily freshness sweep + source probe + satohash re-stamp'
          add-paths: |
            research/countries.json
            public/data/intel.json
            public/data/advisories.json
            public/proofs/*
            public/countries/*.json
            public/trust-state.json
          body: |
            Automated sweep: source probes, freshness, advisories and any Satohash re-stamp.

            Review the corpus diff. A height change here means the record was re-stamped
            and `check:proofs` must pass before this merges.

      # 8) Summary for the morning review
      - name: Intel summary
        run: |
          node -e "
            const i = JSON.parse(require('fs').readFileSync('public/data/intel.json','utf8'));
            const entries = Object.entries(i.programs);
            const changed = entries.filter(([, p]) => p.watch.changed).map(([k]) => k);
            const stale = entries.filter(([, p]) => p.freshness.status === 'stale').map(([k]) => k);
            console.log('## Daily Country Intel');
            console.log('');
            console.log('| Metric | Value |');
            console.log('|--------|-------|');
            console.log('| Sweep | ' + i.sweep.fresh + ' fresh / ' + i.sweep.watch + ' watch / ' + i.sweep.stale + ' stale |');
            console.log('| Satohash API | ' + (i.sweep.satohash_api?.status ?? 'unknown') + ' |');
            console.log('| Auto-researched | ' + entries.filter(([, p]) => p.freshness.status === 'stale').length + ' stale countries |');
            console.log('| Source changes flagged | ' + changed.length + ' |');
            console.log('| Stale (>45d) | ' + stale.length + ' |');
            if (changed.length) {
              console.log('');
              console.log('**Flagged for review:** ' + changed.join(', '));
            }
            if (stale.length) {
              console.log('');
              console.log('**Stale (>45d):** ' + stale.join(', '));
            }
          " >> "$GITHUB_STEP_SUMMARY"
