name: Deploy motopass to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # The Daily Country Intel workflow commits with GITHUB_TOKEN, which does NOT
  # trigger `on: push` (GitHub prevents recursion). Re-run the deploy when that
  # workflow finishes so intel data changes actually reach production.
  workflow_run:
    workflows: ["Daily Country Intel (self-heal)"]
    types: [completed]
    branches: [main]
jobs:
  deploy:
    # For workflow_run: github.sha = last commit on default branch; the intel
    # run's head_sha = the commit it started from. If they differ, intel pushed
    # a commit -> deploy. If equal, intel made no changes -> skip the rebuild.
    if: |
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_sha != github.sha)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci || npm install
      - name: Build
        run: npx vite build
      - name: Deploy to CF Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 pages deploy ./dist --project-name=motopass --branch=main
