name: BTC Map weekly sync
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  btcmap-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run btcmap:density
      - run: npm run btcmap:sync
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/btcmap-sync
          delete-branch: true
          title: 'chore: weekly btcmap density'
          commit-message: 'chore: weekly btcmap density + cache sync'
          add-paths: public/data/btcmap*
          body: 'Automated BTC Map density refresh. Merges only when CI is green.'
