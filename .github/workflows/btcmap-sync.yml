name: BTC Map weekly sync
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  btcmap-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run btcmap:density
      - run: npm run btcmap:sync
      # Same reason as the intel sweep: a GITHUB_TOKEN PR never gets CI, so it
      # cannot satisfy a required check. Publish the branch instead.
      - name: Publish btcmap branch
        run: |
          git config user.name "motopass-btcmap-bot"
          git config user.email "btcmap-bot@motopass.local"
          git add public/data
          if git diff --cached --quiet; then
            echo "No density change; nothing to publish."
            exit 0
          fi
          git commit -m "chore: weekly btcmap density + cache sync"
          git push origin HEAD:refs/heads/bot/btcmap-sync --force-with-lease
          echo "::notice::Density refresh pushed to bot/btcmap-sync — open a PR to review it."
